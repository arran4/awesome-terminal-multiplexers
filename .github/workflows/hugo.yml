name: Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Prepare Content
        run: |
          mkdir -p content
          cp README.md content/_index.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify

      - name: Verify generated home page
        run: |
          test -s public/index.html
          grep -q 'Awesome Terminal Multiplexers' public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
